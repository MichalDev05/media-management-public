<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/table-style.css">
    <title>Table</title>
</head>
<body>

    <div class="container">
        <table id="table">
            <thead id="table_head">
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Age</th>
                </tr>
            </thead>
            <tbody id="table_body">
                <tr  id="table_body_tr">
                    <td>1</td>
                    <td>John Doe</td>
                    <td>25</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Jane Doe</td>
                    <td>22</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>John Smith</td>
                    <td>30</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>Jane Smith</td>
                    <td>28</td>
                </tr>
            </tbody>
        </table>
        <button class="newItemBtn" id="newItemButton">New Item</button>
        <!-- Pagination -->
        <div id="paginationContainer" class="pagination">
            <button id="pagePrevBtn" class="pagePrevBtn">Prev</button>
            <div class="pageNumbers" id="pageNumbers">
                <button class="pageNumberBtn activePage">1</button>
                <button class="pageNumberBtn">2</button>
                <button class="pageNumberBtn">3</button>
                <button class="pageNumberBtn">4</button>
                <button class="pageNumberBtn">5</button>
            </div>
            <button id="pageNextBtn" class="pageNextBtn">Next</button>
        </div>
    </div>

    <script src="/table-script.js"></script>
</body>
</html>
