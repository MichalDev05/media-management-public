<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/form-style.css">
    <title>Form</title>
</head>
<body>

    <div class="container">
        <h1>New Element</h1>

        <form id="form" method="POST">
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title"><br>
            </div>

            <div class="form-group">
                <label for="releaseYear">Release Year:</label>
                <input type="number" id="releaseYear" name="releaseYear"><br>
            </div>

            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" name="description"></textarea><br>
            </div>

            <div class="form-group">
                <label for="length">Length:</label>
                <input type="number" id="length" name="length"><br>
            </div>

            <div class="form-group">
                <label for="image">Image URL:</label>
                <input type="text" id="image" name="image"><br>
            </div>

            <div class="form-group">
                <label for="categoryId">Category ID:</label>
                <input type="number" id="categoryId" name="categoryId"><br>
            </div>
            
            <div class="form-group">
                <label for="true">True:</label>
                <input type="checkbox" id="true" name="true"><br> 
                ><br>
            </div>

            <div class="form-group">
                <label for="dubbings">Dubbings:</label>
                <input type="text" id="dubbings" name="dubbings"></textarea><br>
            </div>

            <button class="saveButton" type="submit">Submit</button>
        </form>
    </div>

    <script src="/form-script.js"></script>
</body>
</html>
